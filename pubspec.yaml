name: clubmanager_sport
description: "App per la gestione di società sportive dilettantistiche."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  supabase_flutter: ^2.12.4
  sentry_flutter: ^9.20.0
  firebase_core: ^4.8.0
  firebase_messaging: ^16.2.1
  flutter_local_notifications: ^20.1.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true